[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-langsmith"
version = "0.2.0"
authors = [
  { name="Tyler Norlund", email="tnorlund@icloud.com" },
]
description = "LangSmith trace schemas, API client, and analytics for receipt evaluation"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.13.5",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "boto3>=1.43.92,<1.44.0",
    "langsmith>=0.12.4",
]

[project.optional-dependencies]
# Local-only Spark dependencies. EMR supplies both PySpark and PyArrow natively;
# the deployment archive installs only the package's base dependencies.
pyspark = [
    "pyspark==4.0.2",
    "pyarrow>=25.0.1",  # Required by parsers/parquet.py
]

# Full variant includes everything (pyspark for EMR)
full = [
    "receipt-langsmith[pyspark]",
]

# Development dependencies
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "pytest-rerunfailures>=16.6.1,<17.0",
    "moto>=5.2.3",
    "black==26.5.1",
    "pylint>=4.0.8,<5.0.0",
    "mypy>=2.3.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "isort==9.0.1",
]

# Lint-only dependencies (installed by CI's lint step)
lint = [
    "black==26.5.1",
    "isort==9.0.1",
]

[tool.hatch.build]
exclude = [
  "tests/",
  "**/*.md",
  "**/*.txt",
  "**/__pycache__/",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["receipt_langsmith"]
include = ["receipt_langsmith/py.typed"]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pylint.format]
max-line-length = 79

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["py4j", "py4j.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
