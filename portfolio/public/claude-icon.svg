    <!-- Sparse paper specks on the coral (not a sandy overlay). -->
    <filter id="paper" x="0%" y="0%" width="100%" height="100%" filterUnits="userSpaceOnUse"
            primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.28" numOctaves="1" seed="23"
                    stitchTiles="stitch" result="t"/>
      <feColorMatrix in="t" type="luminanceToAlpha" result="ta"/>
      <feComponentTransfer in="ta" result="speckA">
        <feFuncA type="linear" slope="7" intercept="-5.1"/>
      </feComponentTransfer>
      <feFlood flood-color="#f8ece4" result="cream"/>
      <feComposite in="cream" in2="speckA" operator="in" result="lights"/>
      <feComponentTransfer in="ta" result="darkA">
        <feFuncA type="linear" slope="-8" intercept="1.1"/>
      </feComponentTransfer>
      <feFlood flood-color="#c85a40" result="rust"/>
      <feComposite in="rust" in2="darkA" operator="in" result="darks"/>
      <feMerge>
        <feMergeNode in="darks"/>
        <feMergeNode in="lights"/>
      </feMerge>
    </filter>
