version: 2

updates:
  # Monitor every current and future npm manifest in the repository.
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      # Packages that peer-depend on each other at an exact minor: bumping
      # one alone makes `npm ci` fail with ERESOLVE (dependabot #1666) or
      # skews jest against its jsdom environment (#868).
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      jest:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
          - "@types/jest"
      # React refuses a react/react-dom version mismatch at import, so a
      # lone `react` bump fails 36 jest suites (dependabot #1677).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # eslint 10 is blocked until eslint-plugin-react (peers eslint ^9.7)
      # and eslint-plugin-jsx-a11y (peers ^9) declare support; eslint 10
      # also stopped bundling @eslint/js. Closed as #869 (May) and #1678
      # (Sep 2026). Drop this once both plugins list eslint ^10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Python dependency manifests, listed explicitly rather than via "**/*".
  # Dependabot's pip file fetcher also scans one directory level below the
  # target directory for requirements *.txt/*.in files, so the glob matched
  # scripts/requirements.txt from both "/" and "/scripts" and opened duplicate
  # PRs (e.g. #1478/#1482, #1550/#1567). Add a directory here when a new
  # pyproject.toml, setup.py or requirements*.txt is introduced.
  - package-ecosystem: "pip"
    directories:
      - "/infra"
      - "/receipt_agent"
      - "/receipt_dynamo"
      - "/receipt_dynamo_stream"
      - "/receipt_embeddings"
      - "/receipt_layoutlm"
      - "/receipt_logo"
      - "/receipt_nutrition"
      - "/receipt_places"
      - "/receipt_upload"
      - "/scripts"
      - "/tools/glyph-studio/py"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    # Only bump a requirement when the new release falls outside its current
    # range. Ranged specs like "boto3>=1.43.89,<1.44.0" already admit every
    # 1.43.x patch, so raising the floor each week was churn (#1659, #1660,
    # #1663 ...). Exact pins (black==, isort==) are still bumped as usual.
    versioning-strategy: increase-if-necessary
    groups:
      python-formatters:
        group-by: dependency-name
        patterns:
          - "black"
          - "isort"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # mcp is pinned <2: receipt_logo/receipt_logo/mcp_server.py and
      # scripts/receipt_mcp_server.py use the mcp 1.x low-level Server API,
      # which breaks under the mcp 2.x rework. Drop after migrating both
      # servers to the v2 API.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # torch is capped <=2.7.0 in receipt_layoutlm: coremltools 9.0 (latest)
      # validates PyTorch only through 2.7.0 and the [coreml] extra has no
      # torch pin of its own. Raise the cap only alongside a coremltools
      # release that certifies a newer torch.
      - dependency-name: "torch"

  # Monitor base-image tags in Dockerfiles throughout the repository.
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "component: infra"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Monitor actions and reusable workflows under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Swift package manifest for the Mac OCR worker.
  - package-ecosystem: "swift"
    directory: "/receipt_ocr_swift"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # soto 7 changed AWSClient's initializer, AWSHTTPBody and the error
      # context API; the OCR worker (SotoAWSClients.swift) must be migrated
      # deliberately (#1688 closed 2026-09-18). Drop this when it is.
      - dependency-name: "github.com/soto-project/soto"
        update-types: ["version-update:semver-major"]
