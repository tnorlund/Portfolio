version: 2

updates:
  # Monitor every current and future npm manifest in the repository.
  - package-ecosystem: "npm"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Monitor every current and future Python dependency manifest.
  - package-ecosystem: "pip"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Monitor base-image tags in Dockerfiles throughout the repository.
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "component: infra"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Monitor actions and reusable workflows under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Monitor the Swift OCR worker package graph.
  - package-ecosystem: "swift"
    directory: "/receipt_ocr_swift"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "swift"
    commit-message:
      prefix: "chore"
      include: "scope"
