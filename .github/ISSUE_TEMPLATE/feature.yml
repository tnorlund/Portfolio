name: Feature / enhancement
description: New capability or intentional improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0: Critical (blocks other work)
        - P1: High (core functionality)
        - P2: Medium (important, not blocking)
        - P3: Low (nice to have)
      default: 2
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - receipt_dynamo / data
        - receipt_upload / OCR pipeline
        - receipt_places / merchant
        - receipt_agent / QA
        - LayoutLM / CoreML
        - Swift OCR worker
        - portfolio frontend
        - infra / Pulumi
        - other
      default: 8
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or system pain does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete change. Prefer one deliverable over an epic.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Acceptance criteria / how we know this is finished.
    validations:
      required: true
