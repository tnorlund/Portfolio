name: Swift CI

# Lean PR gate for the Swift OCR worker: build + unit tests on a GitHub
# macOS runner with its preinstalled Xcode. The 2025-10 version of this
# workflow was disabled for runner/Swift incompatibility and also ran
# LocalStack integration tests via Docker, which GitHub macOS runners do
# not support — those remain manual (see Tests/IntegrationTests/).
# Motivation for re-enabling: PR #1170 shipped a Swift contract test that
# did not compile; nothing ran Swift, so nothing caught it.

on:
    push:
        branches: [main]
        # GitHub Actions does not support YAML anchors, so the watched
        # path list is duplicated below verbatim -- keep them in sync.
        paths:
            - "receipt_ocr_swift/**"
            - ".github/workflows/swift-ci.yml"
            # The Swift decoder is a PORT. When the Python original moves,
            # this workflow must run even though no Swift file changed --
            # otherwise the parity fixture silently freezes, which is
            # exactly what happened between #1313 and #1329.
            - "receipt_upload/receipt_upload/line_items/**"
            # The section assigner is a port too, and its fixture went
            # ungated for as long as this filter omitted it.
            - "receipt_upload/receipt_upload/section_assignment.py"
            - "receipt_upload/receipt_upload/assets/**"
            - "receipt_dynamo/receipt_dynamo/amounts.py"
            - "receipt_dynamo/receipt_dynamo/entities/receipt_summary.py"
            - "receipt_upload/tests/fixtures/line_items_golden*.json"
    pull_request:
        branches: [main]
        paths:
            - "receipt_ocr_swift/**"
            - ".github/workflows/swift-ci.yml"
            - "receipt_upload/receipt_upload/line_items/**"
            # The section assigner is a port too, and its fixture went
            # ungated for as long as this filter omitted it.
            - "receipt_upload/receipt_upload/section_assignment.py"
            - "receipt_upload/receipt_upload/assets/**"
            - "receipt_dynamo/receipt_dynamo/amounts.py"
            - "receipt_dynamo/receipt_dynamo/entities/receipt_summary.py"
            - "receipt_upload/tests/fixtures/line_items_golden*.json"
    workflow_dispatch:

concurrency:
    group: swift-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Swift build + unit tests
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v7

            - name: Swift toolchain
              run: swift --version && xcodebuild -version

            - name: Cache Swift packages
              uses: actions/cache@v6
              with:
                  path: receipt_ocr_swift/.build
                  key: ${{ runner.os }}-spm-${{ hashFiles('receipt_ocr_swift/Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-spm-

            # ANTI-DRIFT. The Swift decoder is a port; its parity fixture is
            # a snapshot of Python output, and a snapshot that is only ever
            # READ goes stale silently (it did: "33/33 parity" between #1313
            # and #1329 measured agreement with a Python that no longer
            # existed). Regenerate from the live Python decoder and fail on
            # any difference, so the expectations can never be older than
            # the code they claim to describe.
            - name: Regenerate parity expectations from live Python
              run: |
                  python3 -m venv .venv-parity
                  source .venv-parity/bin/activate
                  pip install --quiet --no-deps -e receipt_dynamo \
                    -e receipt_embeddings \
                    -e receipt_upload
                  # boto3/Pillow/numpy/openai are imported by the packages'
                  # __init__ chains (receipt_embeddings pulls the openai SDK
                  # via its writer), not by the decoder itself.
                  pip install --quiet boto3 Pillow numpy openai
                  python receipt_ocr_swift/Scripts/generate_line_items_parity.py \
                    --check

            - name: Build
              run: |
                  cd receipt_ocr_swift
                  swift build --build-tests

            - name: Unit tests
              # GeometryTests skipped pending issue #1176 (3 pre-existing
              # failures on current toolchains, never caught while this
              # workflow was disabled). Remove the skip when fixing #1176.
              run: |
                  cd receipt_ocr_swift
                  swift test --skip IntegrationTests --skip GeometryTests
