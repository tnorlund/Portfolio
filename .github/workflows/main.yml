name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    # Validate children against their immediate parent in a PR stack too.
  workflow_dispatch:
    inputs:
      profile_dev_api:
        description: "Deploy and capture dev /images + /receipts profiles"
        required: false
        type: boolean
        default: false

# Superseded PR runs are cancelled (a new push makes the old one moot), but
# main-push runs are NEVER cancelled: their `deploy` job runs `pulumi up`, and
# killing that mid-update can leave the stack locked or partially applied. A
# burst of merges must queue, not interrupt each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHON_VERSION: "3.13"

jobs:
  # ============================================================================
  # STAGE 1: All tests run in parallel
  # ============================================================================
  # Self-hosted jobs share a persistent Mac. Every job below has a
  # `timeout-minutes` (so a hung job releases the runner) and a final
  # `if: always()` cleanup that removes the venv / node_modules / build output
  # it created inside the workspace. Host-level caches (~/Library/Caches/pip,
  # ~/.npm, ~/Library/Caches/ms-playwright) are intentionally kept warm across
  # jobs; pruning them when disk runs low is an ops task on the runner host.

  lambda-syntax:
    name: Lambda Syntax
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true

      - name: Resolve Python
        run: |
          PYTHON_BIN="$(scripts/ensure_python_runtime.sh "$PYTHON_VERSION")"
          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$PYTHON_BIN")" >> "$GITHUB_PATH"
          "$PYTHON_BIN" --version

      - name: Compile all Lambda handler sources
        run: |
          # Compile every .py file under infra/ — catches SyntaxError before
          # docker build copies broken code into a Lambda image. Specifically
          # guards against `keyword argument repeated`-class regressions like
          # the one that crashed unified_evaluator after #861's rebase.
          find infra -name '*.py' -not -path '*/node_modules/*' -not -path '*/.venv*/*' -print0 \
            | xargs -0 "$PYTHON_BIN" -m py_compile

      - name: Verify Python version declarations
        run: |
          "$PYTHON_BIN" scripts/check_python_version_consistency.py

      - name: Test Lambda trust and API contracts
        run: |
          "$PYTHON_BIN" -m venv .venv-email-receipt
          source .venv-email-receipt/bin/activate
          python -m pip install --quiet boto3 pytest "pulumi>=3.261.0,<4" "pulumi-aws>=7.44.0,<8"
          python -m pytest -q \
            infra/tests/test_email_receipt_inbox_handler.py \
            infra/tests/test_ats_verification_ingest.py \
            infra/tests/test_ats_verification_mcp.py
          python -m pytest -q --import-mode=importlib \
            infra/components/test_lambda_profiler.py \
            infra/components/test_route_lambda.py \
            infra/routes/images/handler/test_handler.py \
            infra/routes/receipts/handler/test_handler.py

      - name: Clean up job workspace
        if: always()
        run: rm -rf .venv-email-receipt .pytest_cache

  lambda-images:
    name: Lambda image compatibility
    uses: ./.github/workflows/lambda-images.yml

  python-tests:
    # 3.13 legs keep their historical check names ("Python (<package>)") so
    # branch protection keeps matching them; 3.14 legs get a suffix.
    name: Python (${{ matrix.package }}${{ matrix.python-version != '3.13' && format(', {0}', matrix.python-version) || '' }})
    runs-on: [self-hosted, macOS, ARM64]
    # Both runtimes must pass before deploy.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        package:
          - receipt_embeddings
          - receipt_dynamo
          - receipt_dynamo_stream
          - receipt_places
          - receipt_nutrition
          - receipt_upload
          - receipt_agent
        # The container Lambdas run public.ecr.aws/lambda/python:3.14, so the
        # packages those images ship are also exercised on 3.14. Everything
        # else stays 3.13-only: receipt_layoutlm's image is pinned to 3.13
        # (torch has no cp314 wheels) and the remaining packages are not
        # shipped in a 3.14 image.
        include:
          - { python-version: "3.14", package: receipt_dynamo }
          - { python-version: "3.14", package: receipt_dynamo_stream }
          - { python-version: "3.14", package: receipt_embeddings }
          - { python-version: "3.14", package: receipt_places }
          - { python-version: "3.14", package: receipt_upload }
          - { python-version: "3.14", package: receipt_agent }
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Python
        run: |
          PYTHON_BIN="$(scripts/ensure_python_runtime.sh "${{ matrix.python-version }}")"
          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$PYTHON_BIN")" >> "$GITHUB_PATH"
          "$PYTHON_BIN" --version

      - name: Install and test
        run: |
          # Never fall back to the system interpreter: packages and Lambda use
          # the same Python minor as CI.
          "$PYTHON_BIN" -m venv .venv-${{ matrix.package }}
          source .venv-${{ matrix.package }}/bin/activate
          pip install --upgrade pip wheel

          # Install based on package dependencies
          case "${{ matrix.package }}" in
            receipt_nutrition)
              pip install -e receipt_dynamo
              pip install -e "receipt_nutrition[test]"
              ;;
            receipt_embeddings)
              # Local receipt-dynamo dep is unpublished: install it editable
              # first so the [test]/[lint] resolves never reach for PyPI.
              pip install -e receipt_dynamo
              pip install --no-deps -e receipt_embeddings
              pip install numpy "openai>=2.8.1,<3.0.0"
              pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-rerunfailures
              ;;
            receipt_dynamo_stream)
              pip install -e receipt_dynamo
              pip install --no-deps -e receipt_dynamo_stream
              pip install boto3 pytest pytest-mock pytest-cov pytest-xdist pytest-timeout pytest-rerunfailures moto
              ;;
            receipt_places)
              pip install -e receipt_dynamo
              pip install --no-deps -e receipt_places
              pip install pydantic pydantic-settings structlog boto3 requests tenacity
              pip install pytest pytest-mock pytest-cov pytest-xdist pytest-timeout pytest-rerunfailures moto responses
              ;;
            receipt_upload)
              # Depends on the full local stack (incl. receipt_agent for the
              # Place ID Finder + CORE_LABELS). Install locals editable with
              # --no-deps, then their external deps explicitly so pip never
              # reaches for the (unpublished) sibling packages on PyPI.
              pip install -e receipt_dynamo
              pip install --no-deps -e receipt_dynamo_stream
              pip install --no-deps -e receipt_embeddings
              pip install --no-deps -e receipt_places
              pip install --no-deps -e receipt_agent
              pip install --no-deps -e receipt_upload
              pip install boto3 "openai>=2.8.1,<3.0.0" Pillow pillow-avif-plugin \
                langsmith langgraph "langchain-core>=0.3.0" "langchain-openai>=0.2.0" httpx \
                pydantic pydantic-settings structlog requests tenacity
              pip install pytest pytest-mock pytest-cov pytest-xdist pytest-timeout pytest-rerunfailures moto responses
              ;;
            receipt_agent)
              # Renderer tests need the local data stack, but the sibling
              # packages are not published on PyPI. Keep every local package
              # editable so this job always exercises the checked-out code.
              pip install -e receipt_dynamo
              pip install --no-deps -e receipt_dynamo_stream
              pip install --no-deps -e receipt_embeddings
              pip install --no-deps -e receipt_places
              pip install --no-deps -e receipt_agent
              pip install --no-deps -e receipt_upload
              pip install boto3 "openai>=2.8.1,<3.0.0" Pillow \
                pillow-avif-plugin langsmith langgraph \
                "langchain-core>=0.3.0" "langchain-openai>=0.2.0" httpx \
                pydantic pydantic-settings structlog requests tenacity \
                segno python-barcode numpy
              pip install pytest pytest-asyncio pytest-mock pytest-cov \
                pytest-xdist pytest-timeout pytest-rerunfailures moto \
                responses
              ;;
            *)
              pip install -e "${{ matrix.package }}[test]"
              ;;
          esac

          # Lint (uses versions from pyproject.toml [lint] dependency)
          if [ "${{ matrix.package }}" = "receipt_agent" ]; then
            pip install black isort
            BASE_REF="${{ github.base_ref || 'main' }}"
            CHANGED_PY="$(git diff --name-only --diff-filter=ACMRT \
              "origin/$BASE_REF"...HEAD \
              | grep '\.py$' || true)"
            if [ -n "$CHANGED_PY" ]; then
              while IFS= read -r py_file; do
                black --check --line-length=79 "$py_file"
                isort --check-only --profile=black --line-length=79 \
                  "$py_file"
              done <<< "$CHANGED_PY"
            fi
          else
            pip install -e "${{ matrix.package }}[lint]"
            black --check --line-length=79 ${{ matrix.package }}
            isort --check-only --profile=black --line-length=79 ${{ matrix.package }}
          fi

          # Test
          # --reruns 1 --reruns-delay 2: retry once with a 2s pause to absorb
          # environmental flakes (moto-S3 timestamp races, lock contention
          # under pytest-xdist). Real test failures still fail
          # the build after the retry; only transient failures get masked.
          cd ${{ matrix.package }}
          python -m pytest tests -n auto --timeout=120 --tb=short --maxfail=5 \
            --reruns 1 --reruns-delay 2 \
            -m "not end_to_end and not slow and not performance and not unused_in_production" \
            --cov --cov-report=xml

      - name: Test correction workflow contracts on the selected runtime
        if: matrix.package == 'receipt_agent'
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          # Both correction Lambdas ship the same local stack as this job.
          # Separate invocations isolate each suite's pytest configuration
          # and fixtures while exercising both Python matrix runtimes.
          source .venv-receipt_agent/bin/activate
          python -m pytest -q --confcutdir=tests \
            tests/test_merge_receipt_lambda.py \
            tests/test_merge_receipt_recovery.py \
            tests/test_correction_retry_acceptance.py \
            --timeout=120 --tb=short --maxfail=5
          python -m pytest -q --import-mode=importlib \
            --confcutdir=infra/upload_images/container_ocr/handler/tests \
            infra/upload_images/container_ocr/handler/tests \
            --timeout=120 --tb=short --maxfail=5
          python -m pytest -q --confcutdir=infra/tests \
            infra/tests/test_ocr_results_redrive_mapping.py \
            --timeout=120 --tb=short --maxfail=5

      - name: Test Glyph Studio on the selected runtime
        if: matrix.package == 'receipt_agent'
        run: |
          # The glyph Lambda ships this package too. Reuse the agent job's
          # local dependency stack for its optional section/renderer tests.
          source .venv-receipt_agent/bin/activate
          # Existing offline degradation/metric tests use scipy; the deployed
          # glyph MCP image retains its numpy + Pillow dependency contract.
          pip install -e tools/glyph-studio/py scipy
          python -m pytest tools/glyph-studio/py/tests -n auto \
            --timeout=120 --tb=short --maxfail=5

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          # Artifact names must be unique per run; only the 3.14 legs are suffixed.
          name: coverage-${{ matrix.package }}${{ matrix.python-version != '3.13' && format('-py{0}', matrix.python-version) || '' }}
          path: ${{ matrix.package }}/coverage.xml
          retention-days: 1

      - name: Clean up job workspace
        if: always()
        run: |
          rm -rf .venv-${{ matrix.package }}
          rm -rf ${{ matrix.package }}/coverage.xml ${{ matrix.package }}/.pytest_cache
    # Job-level key; placed after `steps` so it stays clear of the matrix
    # header, which other branches edit.
    timeout-minutes: 30

  repository-tests:
    name: Python (repository tests)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Python
        run: |
          PYTHON_BIN="$(scripts/ensure_python_runtime.sh "$PYTHON_VERSION")"
          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$PYTHON_BIN")" >> "$GITHUB_PATH"
          "$PYTHON_BIN" --version

      - name: Install editable local stack
        run: |
          "$PYTHON_BIN" -m venv .venv-repository-tests
          source .venv-repository-tests/bin/activate
          pip install --upgrade pip wheel
          pip install -e receipt_dynamo
          pip install --no-deps -e receipt_embeddings
          pip install --no-deps -e receipt_dynamo_stream
          pip install --no-deps -e receipt_places
          pip install --no-deps -e receipt_nutrition
          pip install --no-deps -e receipt_agent
          pip install --no-deps -e receipt_upload
          pip install boto3 "openai>=2.8.1,<3.0.0" Pillow \
            pillow-avif-plugin langsmith langgraph \
            "langchain-core>=0.3.0" "langchain-openai>=0.2.0" httpx \
            pydantic pydantic-settings structlog requests tenacity \
            segno python-barcode numpy
          pip install pytest pytest-asyncio pytest-mock pytest-xdist \
            pytest-timeout pytest-rerunfailures moto responses

      - name: Verify eval regression corpus
        run: |
          source .venv-repository-tests/bin/activate
          python synthesis_loop/corpus_regression_gate.py check --json

      - name: Verify evidence provenance
        run: |
          source .venv-repository-tests/bin/activate
          python scripts/verify_evidence_stamps.py --json \
            --head "$GITHUB_SHA"

      - name: Test root and maintained script suites
        run: |
          source .venv-repository-tests/bin/activate
          SCRIPT_TESTS=()
          while IFS= read -r test_file; do
            SCRIPT_TESTS+=("$test_file")
          done < <(find scripts -maxdepth 1 -name 'test_*.py' \
            ! -name 'test_noise_detection.py' \
            ! -name 'test_realtime_embedding.py' -print)
          python -m pytest tests "${SCRIPT_TESTS[@]}" \
            -n auto --timeout=120 --tb=short --maxfail=5 \
            --reruns 1 --reruns-delay 2

      - name: Clean up job workspace
        if: always()
        run: rm -rf .venv-repository-tests .pytest_cache

  typescript-tests:
    name: TypeScript
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Lint and test
        working-directory: portfolio
        run: |
          npm ci --prefer-offline
          npm run lint
          npm run type-check
          npm run test:ci

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-portfolio
          path: portfolio/coverage
          retention-days: 1

      - name: Clean up job workspace
        if: always()
        run: rm -rf portfolio/node_modules portfolio/coverage

  browser-tests:
    name: Browser Tests
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build and test
        working-directory: portfolio
        env:
          CI: true
        run: |
          npm ci --prefer-offline
          npm run build
          # Idempotent: playwright-core skips any browser whose
          # INSTALLATION_COMPLETE marker already exists under
          # ~/Library/Caches/ms-playwright, so this only downloads after a
          # Playwright version bump changes the pinned browser revisions.
          npx playwright install chromium firefox webkit
          # Concurrent runners on one Mac must not share a fixed port or
          # kill each other's servers. Playwright owns server teardown.
          export PLAYWRIGHT_PORT="$(node -e 'const server = require("node:net").createServer(); server.listen(0, "127.0.0.1", () => { console.log(server.address().port); server.close(); });')"
          npx playwright test e2e/hydration.spec.ts --project=chromium --project=firefox --project=webkit

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: portfolio/playwright-report/
          retention-days: 7

      - name: Clean up job workspace
        if: always()
        run: |
          rm -rf portfolio/node_modules portfolio/.next portfolio/out
          rm -rf portfolio/playwright-report portfolio/test-results

  # ============================================================================
  # MANUAL: targeted dev API profiling (never runs on push or pull_request)
  # ============================================================================

  profile-dev-api:
    name: Profile dev API Lambdas
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.profile_dev_api
    needs:
      - lambda-syntax
      - repository-tests
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install infrastructure and profiling tools
        run: |
          pip install -e infra -e receipt_dynamo
          pip install boto3 flameprof pytest tuna

      - name: Test profiling instrumentation
        run: |
          python -m pytest -q --import-mode=importlib \
            receipt_dynamo/tests/unit/test_api_read.py \
            infra/components/test_lambda_profiler.py \
            infra/components/test_route_lambda.py \
            infra/routes/images/handler/test_handler.py \
            infra/routes/receipts/handler/test_handler.py \
            scripts/test_capture_dev_api_profiles.py

      - name: Deploy dev stack
        id: profiled-dev-deploy
        working-directory: infra
        env:
          ENABLE_DEV_LAMBDA_PROFILING: "1"
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "681647709217"
          pulumi preview --stack tnorlund/portfolio/dev --non-interactive
          pulumi up --stack tnorlund/portfolio/dev --yes --non-interactive

      - name: Capture handler and import profiles
        run: |
          mkdir -p api-profile-artifacts
          python scripts/capture_dev_api_profiles.py \
            --route images \
            --route receipts \
            --output-dir api-profile-artifacts \
            | tee api-profile-artifacts/summary.json

          for route in images receipts; do
            flameprof \
              --out "api-profile-artifacts/${route}-handler.svg" \
              "api-profile-artifacts/${route}.prof"
            if [ -s "api-profile-artifacts/${route}.importtime" ]; then
              tuna \
                --outdir "api-profile-artifacts/${route}-imports" \
                "api-profile-artifacts/${route}.importtime"
            fi
          done

      - name: Disable dev profiling
        if: always() && contains(fromJSON('["success", "failure"]'), steps.profiled-dev-deploy.outcome)
        working-directory: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "681647709217"
          pulumi preview --stack tnorlund/portfolio/dev --non-interactive
          pulumi up --stack tnorlund/portfolio/dev --yes --non-interactive

      - name: Upload dev API profiles
        uses: actions/upload-artifact@v7
        with:
          name: dev-api-lambda-profiles-${{ github.sha }}
          path: api-profile-artifacts/
          retention-days: 7

  # ============================================================================
  # STAGE 2: Deploy (only after ALL tests pass, main branch only)
  # ============================================================================

  deploy:
    name: Deploy
    # One production deploy at a time, across runs. Never cancel a running
    # one - Pulumi holds an account-wide lock and an interrupted update is
    # how that lock gets stranded.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs:
      - lambda-syntax
      - lambda-images
      - python-tests
      - repository-tests
      - typescript-tests
      - browser-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "portfolio/package-lock.json"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: docker/setup-buildx-action@v4

      - name: Export public analytics build config
        run: |
          cd infra
          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=$(pulumi config get portfolio:googleAnalyticsMeasurementId --stack tnorlund/portfolio/prod)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_GTM_ID=$(pulumi config get portfolio:googleTagManagerId --stack tnorlund/portfolio/prod)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CLOUDFRONT_ANALYTICS_BEACON_PATH=/analytics/pixel.txt" >> "$GITHUB_ENV"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Build portfolio
        working-directory: portfolio
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Deploy infrastructure
        run: |
          cd infra
          pip install -e .
          pulumi stack select tnorlund/portfolio/prod
          pulumi up --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Deploy to S3 + CloudFront
        run: |
          cd infra
          BUCKET=$(pulumi stack output cdn_bucket_name)
          DIST_ID=$(pulumi stack output cdn_distribution_id)

          # Deletion is scoped to paths the build output actually owns.
          # The bucket also holds prefixes the build knows nothing about
          # (assets/ from the receipt pipeline, ad-hoc backups, anything
          # future); a bucket-wide `sync --delete` treats all of them as
          # stale and wipes them -- the bucket is unversioned, so that
          # loss is permanent (it already destroyed one backup run).
          OUT=../portfolio/out

          # Root-level files: --exclude "*/*" removes every prefixed key
          # from both copy and delete consideration, so this only syncs
          # top-level files (index.html etc.) and deletes stale ones.
          aws s3 sync "$OUT" "s3://$BUCKET" --delete --exclude "*/*" --cache-control "public, max-age=3600"

          # Each top-level directory the build emitted: full sync with
          # delete scoped inside that prefix. assets/ is skipped even if
          # the build ever emits one -- it belongs to the receipt
          # pipeline, and clobbering it deletes every CDN-hosted image.
          for dir in "$OUT"/*/; do
            prefix=$(basename "$dir")
            if [ "$prefix" = "assets" ]; then
              continue
            fi
            aws s3 sync "$OUT/$prefix" "s3://$BUCKET/$prefix" --delete --cache-control "public, max-age=3600"
          done
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # ============================================================================
  # STAGE 3: Post-deploy smoke tests
  # ============================================================================

  smoke-tests:
    name: Smoke Tests
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run backend E2E tests
        run: |
          pip install -e "receipt_dynamo[test]"
          cd receipt_dynamo
          pytest -m end_to_end --timeout=600 --tb=short
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
