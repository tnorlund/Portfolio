[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt_agent"
version = "0.2.0"
description = "Agentic validation for receipt metadata using LangGraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Tyler Norlund" }
]
keywords = [
    "receipt",
    "validation",
    "agent",
    "langgraph",
    "langsmith",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Internal packages (transitive deps: boto3, requests, pydantic*, tenacity, structlog, openai)
    "receipt-dynamo",              # DynamoDB client for receipts
    "receipt-embeddings",          # Vector-search seam (VectorSearchClient)
    "receipt-places",              # Google Places API (brings pydantic*, tenacity, structlog)
    # LangGraph/LangChain for agent orchestration
    "langgraph>=1.2.11",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",  # OpenRouter support (OpenAI-compatible API)
    "langsmith>=0.12.4",
    # HTTP client for async operations
    "httpx>=0.28.1",
    # Receipt graphics rendering (label_evaluator): QR + linear barcodes.
    # Lazily imported in rendering/receipt_graphics.py but required at runtime.
    "segno>=1.6.6",
    "python-barcode>=0.16.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "moto>=5.2.3",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "boto3-stubs[dynamodb,s3]>=1.43.92",
]

[project.urls]
Homepage = "https://github.com/tnorlund/Portfolio"
Documentation = "https://github.com/tnorlund/Portfolio/tree/main/receipt_agent"
Repository = "https://github.com/tnorlund/Portfolio"

[tool.hatch.build]
exclude = [
  "tests/",
  "test/",
  "**/*.md",
  "**/*.txt",
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "**/*.ini",
  "**/*.cfg",
  "**/*.sh",
  "**/conftest.py",
  "**/pytest.ini",
  "fix_*.py",
  "migrate_*.py",
  "analyze_*.py",
  "refactor_*.py",
  "update_*.py",
  "standardize_*.py",
  "remove_*.py",
  "add_*.py",
  "test_*.py",
  "example_*.py",
  "run_tests.py",
  "final_*.py",
  "**/__pycache__/",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.pyd",
  ".coverage",
  ".pytest_cache/",
  "pylint_*.json",
  "missing_*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["receipt_agent"]
include = ["receipt_agent/py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 79
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B904",   # raise without from inside except
]

[tool.ruff.isort]
known-first-party = ["receipt_agent", "receipt_dynamo", "receipt_places"]

[tool.black]
line-length = 79
target-version = ["py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 79

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pylint.format]
max-line-length = 79

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-branches",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "pk", "sk"]

[tool.pylint.design]
max-args = 10
max-locals = 20
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "end_to_end: mark test as an end-to-end test that requires AWS credentials",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
    "ignore:.*urllib3.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["receipt_agent"]
branch = true
omit = ["tests/*"]
parallel = true
concurrency = ["multiprocessing"]
data_file = ".coverage"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
