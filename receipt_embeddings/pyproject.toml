[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-embeddings"
version = "0.1.0"
description = "Backend-neutral vector search interfaces for receipt embeddings"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.43.64,<1.44.0",
  "numpy>=1.26.0,<3.0.0",
  "openai>=2.8.1,<3.0.0",
  "receipt-dynamo",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<10.0.0",
  "pytest-cov>=6.1.0,<8.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "pytest-timeout>=2.1.0,<3.0.0",
  "pytest-rerunfailures>=14.0,<17.0",
]
lint = [
  "black==26.5.1",
  "isort==8.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["receipt_embeddings"]
include = ["receipt_embeddings/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
  "unit: fully offline unit test",
  "vector_integration: live vector backend integration test",
  "performance: opt-in moto benchmarks (RECEIPT_EMBEDDINGS_PERF=1 or -m performance)",
]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pylint.format]
max-line-length = 79

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-branches",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "pk", "sk"]

[tool.pylint.design]
max-args = 10
max-locals = 20

[tool.pylint.imports]
allow-any-import-level = ["boto3"]
