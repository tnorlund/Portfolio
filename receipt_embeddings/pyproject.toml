[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt_embeddings"
version = "0.1.0"
description = "Vector search interface, exact-NN fake, and similarity harness"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Tyler Norlund" }
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-rerunfailures>=14.0",
]
lint = [
    "black==26.5.1",
    "isort==8.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["receipt_embeddings"]
include = ["receipt_embeddings/py.typed"]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79
known_first_party = ["receipt_embeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: mark test as a unit test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["receipt_embeddings"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
