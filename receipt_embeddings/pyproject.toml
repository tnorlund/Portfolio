[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-embeddings"
version = "0.1.0"
authors = [
  { name="Tyler Norlund", email="tnorlund@icloud.com" },
]
description = "Embedding formatters, vector-search client, and exact-NN test fake"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
]
keywords = ["embeddings", "vector", "receipts", "similarity"]

[project.urls]
"Homepage" = "https://github.com/tnorlund/Portfolio"
"Bug Tracker" = "https://github.com/tnorlund/Portfolio/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-cov>=6.1.0,<8.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "pytest-rerunfailures>=14.0,<17.0",
]
lint = [
    "black==26.5.1",
    "isort==8.0.1",
]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy>=1.19.0",
]

[tool.hatch.build]
exclude = [
  "tests/",
  "**/__pycache__/",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["receipt_embeddings"]
include = ["receipt_embeddings/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "unit: mark test as a unit test",
    "vector_integration: live SearchVectors / Chroma Cloud; skipped without creds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["receipt_embeddings"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 79
target-version = ["py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["receipt_embeddings"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
