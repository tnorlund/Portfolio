[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-embeddings"
version = "0.1.0"
description = "Backend-neutral vector search interfaces for receipt embeddings"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.43.64,<1.44.0",
  "numpy>=1.26.0,<3.0.0",
  "openai>=2.8.1,<3.0.0",
  "receipt-dynamo",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<10.0.0",
  "pytest-cov>=6.1.0,<8.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "pytest-timeout>=2.1.0,<3.0.0",
  "pytest-rerunfailures>=14.0,<17.0",
]
lint = [
  "black==26.5.1",
  "isort==8.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["receipt_embeddings"]
include = ["receipt_embeddings/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
  "unit: fully offline unit test",
  "vector_integration: live vector backend integration test",
]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79
