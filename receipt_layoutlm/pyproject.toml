[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt_layoutlm"
version = "0.1.0"
description = "LayoutLM training package for receipt understanding integrated with DynamoDB"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Tyler Norlund", email = "tnorlund@icloud.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  # transformers 5.x has two torch guards:
  #  - import requires torch >= 2.4
  #  - torch.load(weights_only=True) requires torch >= 2.6 (CVE)
  # Pin to the stricter 2.6 floor so anything below silently breaks the
  # resume-from-checkpoint path. Keep transformers <6.0 to avoid blind
  # dependabot bumps across the next major.
  # coremltools 9.0 validates PyTorch through 2.7.0. Keep the shared runtime
  # inside that tested range so training checkpoints remain exportable.
  "torch>=2.6.0,<=2.7.0",
  "transformers>=4.46.0,<6.0.0",
  "datasets>=2.19.0,<6.0.0",
  "numpy>=1.26.0,<3.0.0",
  "scipy>=1.11.0,<2.0.0",
  "boto3>=1.43.32,<1.44.0",
  "pydantic>=2.10.6,<3.0.0",
  "tqdm>=4.66.0,<5.0.0",
  "filelock>=3.13.0,<4.0.0",
  "Pillow>=10.0.0,<13.0.0",
  "sentencepiece>=0.1.99,<1.0.0",
  "accelerate>=0.21.0,<2.0.0",
]

[project.optional-dependencies]
training = [
  # scikit-learn 1.6 is the first release with CPython 3.13 wheels. Keep
  # these metrics-only dependencies out of the CoreML worker environment:
  # coremltools 9.0 supports scikit-learn only through 1.5.1.
  "seqeval>=1.2.2,<2.0.0",
  "scikit-learn>=1.6.0,<2.0.0",
]
coreml = [
  "coremltools==9.0",
]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "black==26.5.1",
  "isort==8.0.1",
  "mypy>=1.19.0",
  "flake8>=7.0.0",
  "seqeval>=1.2.2,<2.0.0",
  "scikit-learn>=1.6.0,<2.0.0",
]

[project.scripts]
layoutlm-cli = "receipt_layoutlm.cli:main"

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
markers = [
  "end_to_end: marks tests as end-to-end (deselect with '-m \"not end_to_end\"')",
]
