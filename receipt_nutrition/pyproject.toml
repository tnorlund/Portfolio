[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-nutrition"
version = "0.1.0"
description = "Source-backed nutrition and dimensional costing for receipt purchases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.5,<3", "receipt-dynamo>=0.3.0"]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "pytest-mock>=3.15.1,<4",
  "pytest-xdist>=3.8.0,<4", "pytest-timeout>=2.4.0,<3",
  "pytest-rerunfailures>=16.6.1,<17", "moto>=5.2.3,<6",
]
lint = ["black==26.5.1", "isort==9.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["receipt_nutrition"]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["receipt_nutrition"]
branch = true

[tool.coverage.report]
show_missing = true
