[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-nutrition"
version = "0.1.0"
description = "Source-backed nutrition and dimensional costing for receipt purchases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.0,<3", "receipt-dynamo>=0.3.0"]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10", "pytest-cov>=6,<8", "pytest-mock>=3.14,<4",
  "pytest-xdist>=3.6,<4", "pytest-timeout>=2.1,<3",
  "pytest-rerunfailures>=14,<17", "moto>=5.1,<6",
]
lint = ["black==26.5.1", "isort==9.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["receipt_nutrition"]

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["receipt_nutrition"]
branch = true

[tool.coverage.report]
show_missing = true
